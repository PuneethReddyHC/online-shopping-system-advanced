<!-- generated by the AI SDLC specification builder -->
name: Independent review

on: pull_request

permissions:
  contents: read
  pull-requests: write   # comments; approval is a person's job

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Review against REVIEW.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -f REVIEW.md || { echo 'No REVIEW.md — the policy must be committed.'; exit 1; }
          git diff --unified=0 origin/${{ github.base_ref }}...HEAD > /tmp/change.diff
          claude -p "Review /tmp/change.diff against REVIEW.md. Report findings only." \
            --allowedTools "Read,Grep,Glob" \
            --output-format json > /tmp/findings.json
          cat /tmp/findings.json
