<!-- generated by the AI SDLC specification builder -->
name: Weekly scan

on:
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Detection is a SCRIPT. A model does not decide what is a finding.
      - id: detect
        run: |
          ./scripts/detect-drift.sh > /tmp/findings.txt
          echo "count=$(wc -l < /tmp/findings.txt)" >> $GITHUB_OUTPUT

      # Tier 3 response: propose. It opens a PR; it does not merge one.
      - if: steps.detect.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Read /tmp/findings.txt. For each finding write an intent.md entry \
            under intents/. Do not change application code." \
            --allowedTools "Read,Write,Grep,Glob"
          gh pr create --title "Weekly scan findings" --body-file /tmp/findings.txt \
            --label automated
