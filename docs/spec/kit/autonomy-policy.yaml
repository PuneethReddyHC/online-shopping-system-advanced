<!-- generated by the AI SDLC specification builder -->
version: 1
project: "Online Shopping System Advanced"
track: "{{fast | standard | governed}}"
owner: "{{WHO}}"

environments:
  local:       { ceiling: A4 }
  development: { ceiling: A4, may_deploy: true }
  staging:     { ceiling: A3, may_deploy: true }
  production:  { ceiling: A1, may_deploy: false,
                 requires: "Named authorisation by {{release manager}}" }

# No agent, at any rung, in any environment.
never:
  - "Approve a pull request"
  - "Modify a test to make a failing check pass"
  - "Read or write a production credential"
  - "Disable or reconfigure a required CI check"
  - "Change this file"

allow: ["make verify", "pytest", "git commit", "git push (non-protected branches)"]
ask:   ["database migration", "dependency addition", "any write outside the repository"]

# Exceptions expire. One without a date is a policy change nobody reviewed.
exceptions: []
